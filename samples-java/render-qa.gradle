// The Affirm environment of the sample app, the Express Checkout demo merchant, and the renderQa
// task that runs RenderQaTest.

def localProperties = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localProperties.load(it) }
}

// -PaffirmEnvironment=production, or affirm.qa.environment in local.properties.
def affirmEnvironment = (project.findProperty('affirmEnvironment')
        ?: localProperties.getProperty('affirm.qa.environment')
        ?: 'sandbox').toString().toUpperCase(Locale.US)
if (!(affirmEnvironment in ['SANDBOX', 'PRODUCTION'])) {
    throw new GradleException("affirmEnvironment must be sandbox or production, not $affirmEnvironment")
}
android.defaultConfig.buildConfigField "String", "AFFIRM_ENVIRONMENT", "\"$affirmEnvironment\""

// publicKey:shippingAndTotalsCallbackUrl of a US merchant enabled for Express Checkout, e.g.
// affirm.qa.express=PUBLIC_KEY:https://merchant.com/shipping-and-totals
// A blank value counts as unset.
def qaExpressValue = (project.findProperty('qaExpress') ?: localProperties.getProperty('affirm.qa.express'))
        ?.toString()?.trim()
def qaExpress = qaExpressValue ? qaExpressValue.split(':', 2) : null
if (qaExpress && qaExpress.length != 2) {
    throw new GradleException('affirm.qa.express must be PUBLIC_KEY:CALLBACK_URL')
}
android.defaultConfig.buildConfigField "String", "EXPRESS_PUBLIC_KEY", "\"${qaExpress ? qaExpress[0] : ''}\""
android.defaultConfig.buildConfigField "String", "EXPRESS_CALLBACK_URL", "\"${qaExpress ? qaExpress[1] : ''}\""

// Cases are publicKey:amount:html|native[:USA|GBR|CAN], comma separated; the country defaults to
// USA. Keep production keys in local.properties.
def qaCases = (project.findProperty('qaCases') ?: localProperties.getProperty('affirm.qa.cases'))?.toString()

task renderQa {
    group = 'verification'
    description = 'Runs RenderQaTest on the connected device and saves screenshots, logs and summary.md under build/render-qa.'
    dependsOn 'installDebug', 'installDebugAndroidTest'

    doLast {
        if (!qaCases) {
            throw new GradleException('Add the cases to local.properties, e.g.\n' +
                    'affirm.qa.environment=production\n' +
                    'affirm.qa.cases=PUBLIC_KEY:500:html,OTHER_KEY:100:native,UK_KEY:100:native:GBR')
        }
        def adb = android.adbExecutable.absolutePath
        def runId = new Date().format('yyyyMMdd-HHmmss')
        println "Render QA on $affirmEnvironment, run $runId"
        def output = new ByteArrayOutputStream()
        exec {
            commandLine adb, 'shell', 'am', 'instrument', '-w', '-r',
                    '-e', 'class', 'com.affirm.samples.RenderQaTest',
                    '-e', 'qaCases', qaCases,
                    '-e', 'runId', runId,
                    'com.affirm.samples.test/androidx.test.runner.AndroidJUnitRunner'
            standardOutput = output
            errorOutput = output
            ignoreExitValue = true
        }

        def localRoot = file("$buildDir/render-qa")
        localRoot.mkdirs()
        exec {
            commandLine adb, 'pull', "/sdcard/Android/data/com.affirm.samples/files/affirm-qa/$runId", localRoot.absolutePath
            standardOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def runDir = new File(localRoot, runId)
        runDir.mkdirs()
        def text = output.toString('UTF-8')
        new File(runDir, 'instrumentation.txt').text = text

        def summary = new File(runDir, 'summary.md')
        if (summary.exists()) {
            summary.eachLine { line ->
                if (line.startsWith('- ') || line.startsWith('|')) {
                    println line
                }
            }
        }
        println "\nEvidence: ${runDir.absolutePath}"
        if (!text.contains('OK (') || text.contains('FAILURES!!!')) {
            def result = text.indexOf('INSTRUMENTATION_RESULT: stream=')
            println(result >= 0 ? text.substring(result) : text)
            throw new GradleException("Render QA failed. See ${summary.exists() ? summary : runDir}")
        }
    }
}
