apply plugin: 'com.android.application'

def localProperties = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localProperties.load(it) }
}
// -PaffirmEnvironment=production, or affirm.qa.environment in local.properties.
def affirmEnvironment = (project.findProperty('affirmEnvironment')
        ?: localProperties.getProperty('affirm.qa.environment')
        ?: 'sandbox').toString().toUpperCase(Locale.US)
if (!(affirmEnvironment in ['SANDBOX', 'PRODUCTION'])) {
    throw new GradleException("affirmEnvironment must be sandbox or production, not $affirmEnvironment")
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion rootProject.ext.compileSdkVersion

        consumerProguardFiles 'proguard-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "AFFIRM_ENVIRONMENT", "\"$affirmEnvironment\""
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':affirm')

    // aar
//    implementation(name: 'affirm', ext: 'aar')
//    implementation "com.squareup.okhttp3:okhttp:3.12.1"
//    implementation "com.google.code.gson:gson:2.8.5"

    // maven
//    implementation "com.affirm:affirm-android-sdk:1.0.13"

    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.recyclerview:recyclerview:1.0.0"

    testImplementation 'junit:junit:4.12'

    androidTestImplementation 'androidx.test.espresso:espresso-web:3.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}
