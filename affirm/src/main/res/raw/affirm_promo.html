<html>
    <head>
        <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
    </head>
    <body>
        <!-- Inert payload. DOMPurify is injected at document start, not string-replaced into this file. -->
        <script type="application/json" id="affirm-promo-payload">{{AFFIRM_PROMO_PAYLOAD}}</script>
        <p id="affirm-promo-root"></p>
        <script>
            // Renders one promo. The host may call it again with { renderId, html } to replace the
            // promo without reloading the page; page-level resources are created once.
            (window.affirmPromoRender = function (job) {
                var host = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.affirmPromo;
                var page = window.affirmPromoPage = window.affirmPromoPage || {};
                var settled = false;
                var payload = null;
                try {
                    payload = JSON.parse(document.getElementById('affirm-promo-payload').textContent);
                } catch (e) {
                    payload = null;
                }
                if (payload && job) {
                    payload.renderId = job.renderId;
                    payload.html = job.html;
                }
                if (payload) {
                    page.renderId = payload.renderId;
                }
                // A replaced render stops reporting.
                function isCurrent() {
                    return page.renderId === payload.renderId;
                }
                function post(body) {
                    if (!host || !payload || !isCurrent()) {
                        return;
                    }
                    body.renderId = payload.renderId;
                    try {
                        host.postMessage(body);
                    } catch (e) {}
                }
                function fail(reason) {
                    if (!settled) {
                        settled = true;
                        post({ event: 'failure', reason: reason });
                    }
                }
                if (!payload) {
                    fail('template_error');
                    return;
                }
                setTimeout(function () { fail('html_timeout'); }, payload.timeoutMs || 5000);

                // Errors thrown by affirm.js are not ours to report; only this script's own failures are.
                try {
                    function isHttps(url) {
                        return /^https:\/\//i.test(url);
                    }
                    function isAllowedStylesheet(url) {
                        return isHttps(url) || /^file:\/\//i.test(url);
                    }
                    function contentHeight() {
                        var root = document.getElementById('affirm-promo-root');
                        var height = root ? root.getBoundingClientRect().height : 0;
                        var bodyStyle = window.getComputedStyle(document.body);
                        height += parseFloat(bodyStyle.marginTop) || 0;
                        height += parseFloat(bodyStyle.marginBottom) || 0;
                        return Math.ceil(height);
                    }
                    // Widths a wrap_content view can shrink to: the promo on one line, and its widest
                    // line as wrapped in the current viewport.
                    function contentWidths() {
                        var root = document.getElementById('affirm-promo-root');
                        if (!root) {
                            return { width: 0, lineWidth: 0 };
                        }
                        var rootStyle = window.getComputedStyle(root);
                        var bodyStyle = window.getComputedStyle(document.body);
                        function sum(values) {
                            return values.reduce(function (total, value) {
                                return total + (parseFloat(value) || 0);
                            }, 0);
                        }
                        var bodyMargins = sum([bodyStyle.marginLeft, bodyStyle.marginRight]);
                        var rootEdges = sum([rootStyle.paddingLeft, rootStyle.paddingRight,
                            rootStyle.borderLeftWidth, rootStyle.borderRightWidth]);
                        // The range covers the content only; the max-content box includes the edges.
                        var range = document.createRange();
                        range.selectNodeContents(root);
                        var lineWidth = range.getBoundingClientRect().width + rootEdges + bodyMargins;
                        var previous = root.style.width;
                        root.style.width = 'max-content';
                        var width = root.getBoundingClientRect().width + bodyMargins;
                        root.style.width = previous;
                        return { width: Math.ceil(width), lineWidth: Math.ceil(lineWidth) };
                    }
                    function whenLoaded(element, isLoaded, reason) {
                        return new Promise(function (resolve) {
                            if (isLoaded) {
                                if (isLoaded(element)) {
                                    resolve();
                                    return;
                                }
                                if (element.complete) {
                                    fail(reason);
                                    return;
                                }
                            }
                            element.addEventListener('load', function () {
                                if (isLoaded && !isLoaded(element)) {
                                    fail(reason);
                                } else {
                                    resolve();
                                }
                            });
                            element.addEventListener('error', function () { fail(reason); });
                        });
                    }
                    function waitForStylesheet(url) {
                        if (!url) {
                            return Promise.resolve();
                        }
                        if (!isAllowedStylesheet(url)) {
                            fail('resource_failed');
                            return Promise.resolve();
                        }
                        var link = document.createElement('link');
                        link.rel = 'stylesheet';
                        // Rejects, so a later render waiting on this page's stylesheets fails too.
                        var wait = new Promise(function (resolve, reject) {
                            link.addEventListener('load', resolve);
                            link.addEventListener('error', reject);
                        });
                        link.href = url;
                        document.head.appendChild(link);
                        return wait;
                    }

                    if (!page.style) {
                        page.style = document.createElement('style');
                        page.style.textContent = (payload.bundledCSS || '') + '\n' + (payload.nativeCSS || '');
                        document.head.appendChild(page.style);
                    }

                    var purify = window.DOMPurify;
                    if (!purify || !purify.isSupported) {
                        fail('sanitizer_unavailable');
                        return;
                    }
                    purify.removeHook('uponSanitizeAttribute');
                    purify.addHook('uponSanitizeAttribute', function (node, data) {
                        if ((data.attrName === 'href' || data.attrName === 'src') && !isHttps(data.attrValue)) {
                            data.keepAttr = false;
                        }
                    });
                    var root = document.getElementById('affirm-promo-root');
                    try {
                        root.innerHTML = purify.sanitize(payload.html || '', {
                            ALLOWED_TAGS: ['a', 'b', 'strong', 'em', 'i', 'u', 'small', 'sup', 'sub',
                                'br', 'span', 'p', 'div', 'img', 'svg', 'g', 'path', 'circle', 'rect',
                                'ellipse', 'line', 'polygon', 'polyline', 'title'],
                            ALLOWED_ATTR: ['class', 'href', 'src', 'alt', 'title', 'width', 'height',
                                'viewBox', 'd', 'fill', 'fill-rule', 'clip-rule', 'stroke',
                                'stroke-width', 'transform', 'x', 'y', 'cx', 'cy', 'r', 'rx', 'ry',
                                'x1', 'y1', 'x2', 'y2', 'points', 'xmlns'],
                            ALLOW_ARIA_ATTR: false,
                            ALLOW_DATA_ATTR: false
                        });
                    } catch (e) {
                        fail('sanitizer_unavailable');
                        return;
                    }
                    var usable = !!(root.textContent.trim() || root.querySelector('img[src], svg'));
                    post({ event: 'sanitized', usable: usable });
                    if (!usable) {
                        fail('html_empty');
                        return;
                    }

                    if (!window._affirm_config) {
                        window._affirm_config = {
                            public_api_key: payload.publicKey || '',
                            script: payload.jsURL || '',
                            locale: payload.locale || '',
                            country_code: payload.countryCode || ''
                        };
                        (function(l,g,m,e,a,f,b){var d,c=l[m]||{},h=document.createElement(f),n=document.getElementsByTagName(f)[0],k=function(a,b,c){return function(){a[b]._.push([c,arguments])}};c[e]=k(c,e,"set");d=c[e];c[a]={};c[a]._=[];d._=[];c[a][b]=k(c,a,b);a=0;for(b="set add save post open empty reset on off trigger ready setProduct".split(" ");a<b.length;a++)d[b[a]]=k(c,e,b[a]);a=0;for(b=["get","token","url","items"];a<b.length;a++)d[b[a]]=function(){};h.async=!0;h.src=g[f];n.parentNode.insertBefore(h,n);delete g[f];d(g);l[m]=c})(window,window._affirm_config,"affirm","checkout","ui","script","ready");
                    }

                    if (!page.stylesheets) {
                        page.stylesheets = [];
                        page.stylesheets.push(waitForStylesheet(payload.remoteCssURL || ''));
                        if (settled) {
                            return;
                        }
                        page.stylesheets.push(waitForStylesheet(payload.remoteFontURL || ''));
                        if (settled) {
                            return;
                        }
                    }
                    var waits = page.stylesheets.slice();
                    var images = root.querySelectorAll('img');
                    for (var i = 0; i < images.length; i++) {
                        if (!images[i].getAttribute('src')) {
                            continue;
                        }
                        waits.push(whenLoaded(images[i],
                            function (el) { return el.complete && el.naturalWidth > 0; },
                            'image_failed'));
                    }
                    if (document.fonts && document.fonts.ready) {
                        waits.push(document.fonts.ready);
                    }
                    Promise.all(waits).then(function () {
                        // fonts.ready also resolves when a font file fails to load.
                        var fontFailed = false;
                        if (document.fonts) {
                            document.fonts.forEach(function (font) {
                                if (font.status === 'error') {
                                    fontFailed = true;
                                }
                            });
                        }
                        if (fontFailed) {
                            fail('font_failed');
                            return;
                        }
                        // The WebView stays hidden until ready, and a hidden view may never get an
                        // animation frame. getBoundingClientRect forces layout, so no frame is needed.
                        setTimeout(function () {
                            if (settled || !isCurrent()) {
                                return;
                            }
                            var height;
                            var widths;
                            try {
                                height = contentHeight();
                                widths = contentWidths();
                            } catch (e) {
                                fail('script_error');
                                return;
                            }
                            settled = true;
                            post({
                                event: 'ready',
                                height: height,
                                width: widths.width,
                                lineWidth: widths.lineWidth,
                                text: (root.textContent || '').replace(/\s+/g, ' ').trim()
                            });
                            if (window.ResizeObserver) {
                                if (page.observer) {
                                    page.observer.disconnect();
                                }
                                // A migrated body fills the view, so only the root sees content changes.
                                var observer = page.observer = new ResizeObserver(function () {
                                    var widths = contentWidths();
                                    post({ event: 'height', height: contentHeight(),
                                        width: widths.width, lineWidth: widths.lineWidth });
                                });
                                observer.observe(document.body);
                                observer.observe(root, { box: 'border-box' });
                            }
                        });
                    }, function () {
                        fail('resource_failed');
                    });
                } catch (e) {
                    fail('script_error');
                }
            })();
        </script>
    </body>
</html>
