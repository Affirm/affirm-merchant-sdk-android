# The existing SDK PR pipeline uploads this file on every PR update.
# Validation-only dependency refs; remove after UX merges and the generator is released.
env:
  FE_BUILDKITE_BRANCH: preview/sdk-live-20261110
  UPFUNNEL_SDK_PROMO_HARNESS_REF: codex/fix-upfunnel-sdk-thor-fixture
  SDK_PROMO_PLATFORM: android
  SDK_PROMO_SETUP_ONLY: 'true'
  SDK_PROMO_RETRY_BUILD: '162'
  SDK_PROMO_RETRY_COMMIT: 18c12d438ab259c56135698a4c80e1e3bfc63d5c
  FE_REPO: ux
steps:
  - label: ':pipeline: Generate live SDK promo tests'
    agents:
      queue: android
    command: |
      set -eu
      git clone --depth 1 --branch "$${FE_BUILDKITE_BRANCH:-production}" git@github.com:Affirm/frontend-buildkite.git .sdk-promo-pipeline
      node .sdk-promo-pipeline/dist/dispatch.cjs upfunnel-sdk-promo-tests
    plugins:
      - docker#v5.11.0:
          image: node:24-bookworm
          propagate-environment: true
          mount-buildkite-agent: true
          mount-ssh-agent: true
