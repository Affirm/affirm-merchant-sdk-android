name: SDK promo emulator tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promo-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record SDK revision
        run: git rev-parse HEAD | tee sdk-revision.txt
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install legacy compile SDK
        run: sdkmanager 'platforms;android-28' 'build-tools;30.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run promo tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            export JAVA_HOME="$JAVA_HOME_8_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            ./gradlew --no-daemon --console=plain :samples-java:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.affirm.android.PromoMessagingEmulatorTest
            python3 tools/verify-promo-emulator-results.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-promo-emulator-results
          path: |
            sdk-revision.txt
            samples-java/build/outputs/androidTest-results/**
            samples-java/build/reports/androidTests/**
